topic: "Do Register Tokens Regularize Vision Transformers Under Data Scarcity?"
context: "DLE-AI-202 Deep Learning Final Project (Cohort I 2026) - Track 1: Pure Research"
target_backbone: "ViT-Tiny (timm vit_tiny_patch16_224, d=192, L=12, H=3)"
dataset: "CIFAR-100 Stratified Low-Data Subset (100 samples/class = 10,000 images)"
sweep_matrix:
  register_counts: [0, 1, 4, 8]
  seeds: [42, 1337, 2026]
  total_runs: 12

items:
  - name: "Darcet et al. (ICLR 2024) - Vision Transformers Need Registers"
    description: "Foundational work introducing learnable register tokens to eliminate high-norm background attention artifacts in large foundation ViTs (DINOv2, OpenCLIP)."
    relevance: "Primary theoretical baseline for register token formulation and attention sink mechanics."
  
  - name: "Jiang et al. (NeurIPS 2025) - ViTs Don't Need Trained Registers"
    description: "Proposes test-time feature aggregation and frequency-domain stability filtering to mitigate background artifacts without retraining register parameters."
    relevance: "Key counter-perspective on whether learned parameters vs. post-hoc aggregation are required."
  
  - name: "Xiao et al. (ICLR 2024) - Efficient Streaming Language Models with Attention Sinks"
    description: "Identifies initial token attention sinks in autoregressive transformers caused by the Softmax sum-to-1 constraint."
    relevance: "Cross-modality proof that Softmax forces transformer attention mechanisms to designate uninformative tokens as numerical sinks."
  
  - name: "Small ViT Inductive Bias & Low-Data Generalization"
    description: "Literature on ViT vulnerability to severe overfitting on small datasets (<50k images) due to lack of hardwired translational equivariance."
    relevance: "Direct justification for studying registers as structural regularizers rather than mere visual cleanup tools."

execution:
  batch_size: 3
  items_per_agent: 1
  output_dir: "./Atlas"
