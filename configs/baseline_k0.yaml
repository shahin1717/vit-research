experiment:
  name: "vit_tiny_baseline_k0"
  description: "Standard register-free ViT-Tiny baseline on 10k CIFAR-100 subset"
  seed: 42
  device: "cuda"

model:
  backbone: "vit_tiny_patch16_224"
  pretrained: true
  num_classes: 100
  num_registers: 0          # K = 0 (Control Baseline)
  drop_rate: 0.0
  attn_drop_rate: 0.0

data:
  dataset: "cifar100"
  data_dir: "./data"
  image_size: 224
  samples_per_class: 100    # Low-data regime: 100 * 100 = 10,000 images
  batch_size: 64
  num_workers: 4
  val_split: 0.1

training:
  epochs: 50
  optimizer: "adamw"
  lr: 0.0005
  weight_decay: 0.05
  lr_scheduler: "cosine"
  warmup_epochs: 5
  min_lr: 0.00001
  amp: true                 # Automatic Mixed Precision
  gradient_clip: 1.0

logging:
  save_dir: "./outputs/baseline_k0"
  checkpoint_dir: "./checkpoints/baseline_k0"
  log_freq_steps: 20
  eval_freq_epochs: 1
  save_attention_maps: true
